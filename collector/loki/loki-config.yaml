auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 720h          # hot-поиск 30 дней (долгий архив — в S3/gdrive/local бэкенде)
  reject_old_samples: false
  max_query_lookback: 0s
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  volume_enabled: true
  max_query_series: 20000         # топ-destinations: доменов >500, дефолт (500) режет запрос
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
analytics:
  reporting_enabled: false
