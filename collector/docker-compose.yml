services:
  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    container_name: logcollector-loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [logcol]

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    container_name: logcollector-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in .env}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"        # только loopback; доступ через SSH-туннель
    networks: [logcol]
    depends_on: [loki]

  vector:
    image: timberio/vector:0.61.0-alpine@sha256:3bb7ed5152910ed51729e256937b1d8a4bf67ff624e9d565e8e5877bffd015c7
    container_name: logcollector-vector
    restart: always
    volumes:
      - ./vector/vector.aggregator.yaml:/etc/vector/vector.yaml:ro
      - ./vector/tls:/tls:ro
      - ./spool:/spool
      - /var/log/remnanode:/self-logs:ro   # локальные логи ноды-коллектора (если она и сама нода)
      - vector-data:/vector-data
    ports:
      # приём от агентов (TLS). ВНИМАНИЕ: Docker публикует порт В ОБХОД ufw — доступ фильтруется
      # в цепочке DOCKER-USER: default-deny ставит collector-firewall-init.sh, ноды — add-node-fw.sh
      - "0.0.0.0:6000:6000"
    networks: [logcol]
    depends_on: [loki]

volumes:
  loki-data:
  grafana-data:
  vector-data:

networks:
  logcol:
    driver: bridge
